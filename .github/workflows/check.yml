# Types and the analyzer's checks (intent matching, framework adapters, change grouping, lazy == full, review
# lifecycle) on every push and pull request, on Linux, macOS and Windows: the install path (setup) runs too, from a
# fresh checkout. The checks analyze the demo branches, so the whole history is fetched.
name: check
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.email ci@example.com
      - run: git config --global user.name ci
      - run: node scripts/setup.mjs --no-skill
      - run: npm run check
      - run: npm test
