# Types and the analyzer's checks (intent matching, framework adapters, change grouping, lazy == full) on every
# push and pull request. The checks analyze the demo branches, so the whole history is fetched.
name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: node scripts/setup.mjs --no-skill
      - run: npm run check
      - run: npm test
